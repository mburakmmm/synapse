analysis_intent: confirmatory
question: In adult male Drosophila MaleCNS v1.0, does pathway-specific acute GABAergic
  disinhibition (edge_mask) or GABAergic silencing (neuron_silencing) of the 26 feedforward
  VNC GABA interneurons elevate MesoLN tactile-driven firing in ascending relays ANXXX027_L
  (523539) and AN08B012_R (558778) relative to matched baseline and structurally matched
  VNC GABA controls?
hypothesis: Under 40 Hz R-MesoLN tactile drive, acute edge_mask (26 VNC GABA -> 6
  ascending relays) increases firing in both 523539 and 558778 relative to 40 Hz baseline
  and matched VNC GABA ablation; global gaba_cell_death increases 523539 beyond both
  40 Hz baseline and matched controls, and under 20 Hz low drive raises 523539 and
  558778 sensitivity relative to 20 Hz baseline.
