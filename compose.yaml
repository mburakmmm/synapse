# Local-first SYNAPSE workstation stack (loopback-only ports; never bundles datasets/runs)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env or .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - synapse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse} -d ${POSTGRES_DB:-synapse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    user: "10001:10001"
    environment:
      SYNAPSE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env or .env}@postgres:5432/${POSTGRES_DB:-synapse}
      SYNAPSE_DATA_DIR: /workspace/data
      SYNAPSE_RUNS_DIR: /workspace/runs
      SYNAPSE_PROTOCOLS_DIR: /workspace/research/protocols
      SYNAPSE_API_HOST: 0.0.0.0
      SYNAPSE_API_PORT: 8000
      SYNAPSE_CORS_ORIGINS: ${SYNAPSE_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
      SYNAPSE_OFFLINE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/workspace/data:ro
      - ./runs:/workspace/runs:rw
      - ./research/protocols:/workspace/research/protocols:rw
    healthcheck:
      test:
        [
          "CMD",
          "/workspace/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    user: "10001:10001"
    environment:
      SYNAPSE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env or .env}@postgres:5432/${POSTGRES_DB:-synapse}
      SYNAPSE_DATA_DIR: /workspace/data
      SYNAPSE_RUNS_DIR: /workspace/runs
      SYNAPSE_PROTOCOLS_DIR: /workspace/research/protocols
      SYNAPSE_OFFLINE: "1"
    # Note: no Docker socket mounted in worker; jobs run in bounded Python subprocesses.
    # Optional Brian2CUDA GPU acceleration requires a verified Linux/CUDA host profile (`gpu`)
    # and is intentionally NOT enabled by default or claimed verified on native Windows.
    volumes:
      - ./data:/workspace/data:ro
      - ./runs:/workspace/runs:rw
      - ./research/protocols:/workspace/research/protocols:rw
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    user: "10001:10001"
    environment:
      VITE_API_BASE_URL: ""
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  synapse_pgdata:
