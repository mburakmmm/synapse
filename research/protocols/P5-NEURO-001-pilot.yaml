analysis_intent: exploratory
question: 'Exploratory pilot: How do progressive targeted premotor hub cell death
  vs. direct hub->MN9 synapse loss and matched-random controls degrade feeding-motor
  output (MN9_right, MN9_left) in FlyWire FAFB v630 (RUO)?'
hypothesis: Under 100 Hz sugar-GRN drive on flywire_fafb_v630, ablating static L0
  top-12 premotor hubs (60.5% of MN9 excitatory synapses) suppresses MN9 firing sharply
  relative to intact baseline and matched-random cell/synapse controls, while isolating
  whole-cell loss vs. direct synapse loss.
