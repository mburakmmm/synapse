schema_version: '1.0'
protocol_id: P5-ADD-001-PILOT
revision: 1
status: draft
analysis_intent: exploratory
question: In adult male Drosophila MaleCNS v1.0, how do verified L2 mushroom-body
  dopamine plasticity weight states across acquisition, parallel-memory extinction,
  and reinstatement shape opposing glutamatergic avoidance (MBON02/04) vs. cholinergic
  approach (MBON12/14/18) firing rates relative to Hungarian-matched KC controls and
  CS- odor specificity?
hypothesis: 'Exploratory pilot (N=3 paired seeds, 24 full-CNS runs) coupled to verified
  L2 mb_dopamine_plasticity_v1 snapshots: post-acquisition KC->MBON_avoid depression
  suppresses MBON02 and disinhibits MBON14 (via 380 MBON02->MBON14 GLUT synapses);
  post-extinction KC->MBON_approach depression suppresses MBON12/14/18; reinstatement
  restores approach firing; matched KC controls and CS- cues remain unaffected.'
