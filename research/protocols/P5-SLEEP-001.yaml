schema_version: '1.0'
protocol_id: P5-SLEEP-001
revision: 1
status: draft
analysis_intent: confirmatory
question: In adult male Drosophila MaleCNS v1.0, does dorsal clock DN1p driving suppress
  anterior visual pathway TuTuB_b interneurons (22794, 520699) via DN1pB->TuBu01/TuTuB_b
  glutamatergic edges beyond baseline and structurally matched cb_intrinsic GLUT controls,
  and does misaligned 50 Hz light + DN1p drive recruit TuBu01 (114115), ExR1 (11886),
  and ER5 (10043)?
hypothesis: 'Confirmatory protocol (N=15 paired seeds, 120 runs) grounded in P5-SLEEP-001-PILOT:
  DN1p activation suppresses bilateral TuTuB_b (22794, 520699) relative to baseline
  and matched controls, masking DN1pB->TuBu01/TuTuB_b edges rescues TuTuB_b firing,
  and 50 Hz light + DN1p drive elevates TuBu01 (114115), ExR1 (11886), and ER5 (10043);
  30 Hz ER5-gain and ER5->ExR1 edge-mask remain null/secondary while EB inputs stay
  sub-threshold at 30 Hz.'
