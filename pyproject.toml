[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse"
version = "0.1.0.dev0"
description = "Local-first, reproducible computational neuroscience research laboratory (Research Use Only)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "brian2>=2.10,<2.11",
    "polars>=1.10,<2",
    "pyarrow>=18.0,<21",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.23,<5",
    "matplotlib>=3.9,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
    "httpx>=0.27,<1",
]

[project.scripts]
synapse = "synapse_cli.main:main"
synapse-worker = "synapse_worker.cli:main"

[tool.setuptools.packages.find]
where = ["packages", "apps/api", "apps/worker"]
include = ["synapse_*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: fast unit and analytical verification tests",
    "integration: end-to-end fixture pipeline and CLI integration tests",
    "scientific: published benchmark reproduction tests",
    "slow: computationally intensive simulations",
    "gpu: tests requiring validated CUDA/GPU hardware",
    "external: tests requiring network access or external dataset downloads",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "apps/api", "apps/worker", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["packages", "apps/api", "apps/worker"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "brian2",
    "brian2.*",
    "scipy",
    "scipy.*",
    "matplotlib",
    "matplotlib.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
