schema_version: '1.0'
protocol_id: P5-SLEEP-001-PILOT
revision: 1
status: draft
analysis_intent: exploratory
question: In adult male Drosophila MaleCNS v1.0, how do dorsal circadian clock inputs
  (DN1p), visual AVP inputs (MeTu2a, aMe12), and ER5 ellipsoid-body GABAergic homeostat
  efficacy modulate firing in ExR1, ER5, TuBu01/06, 5thsLNv_LNd6, LNd_b, and EPG readouts?
hypothesis: Exploratory pilot (N=3 paired seeds, 24 runs) paired with verified L3
  circadian-homeostatic oscillator snapshots to quantify pathway responsiveness, DN1p
  vs matched control specificity, and ER5->ExR1 gating prior to drafting confirmatory
  protocol P5-SLEEP-001.
