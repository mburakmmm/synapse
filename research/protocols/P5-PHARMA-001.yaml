analysis_intent: confirmatory
question: 'Confirmatory (unfrozen draft pending human freeze): In adult male Drosophila
  MaleCNS v1.0, does L2 dose-independent receptor modulation produce bidirectional
  Rdl (GABA_A) separation (noncompetitive disinhibition vs. allosteric PAM suppression),
  orthogonal nAChR attenuation, and near-Bliss dual-target suppression on ascending
  relays (523539, 558778, 10592) beyond matched off-pathway VNC GABA controls and
  zero-stimulus sham (RUO)?'
hypothesis: 'Calibrated from exploratory P5-PHARMA-001-PILOT (N=3, 24/24 runs, run_wall_mean_s=138.72
  s; 120 confirmatory runs est. 1.54 h on workers=3): Rdl 100% block amplifies ANXXX027_L
  (523539), Rdl 1.75x PAM and nAChR 50% attenuation suppress relay rates, combined
  PAM+nAChR tracks Bliss independence (expected 0.6982 / observed 0.7692 on 523539;
  0.5893 / 0.6071 on 558778), and matched_vnc_gaba_controls 100% outgoing block yields
  null shift vs vehicle_baseline_40hz.'
