name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Python Lint, Typecheck, and Fixture Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --locked

      - name: Ruff lint check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy static type check
        run: uv run mypy packages apps/api apps/worker tests

      - name: Run non-slow, offline, CPU tests
        run: uv run pytest -m "not slow and not gpu and not external" -v

  web:
    name: Web Typecheck, Unit Tests, and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest UI tests
        run: npm run test

      - name: Vite production build
        run: npm run build
