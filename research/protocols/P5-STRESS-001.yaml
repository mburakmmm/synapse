revision: 1
status: draft
analysis_intent: confirmatory
question: 'Confirmatory (unfrozen draft pending human freeze): In adult male Drosophila
  MaleCNS v1.0, does chronic inhibitory-reserve erosion (0.5x/0.0x GABA/GLUT onto
  DNp01/DNp09) with or without sensory threat sensitization (1.4x LC4+LC9) elevate
  DNp01 escape and DNp09 freezing proxies beyond acute 30 Hz threat and Hungarian-matched
  off-pathway inhibitory controls (RUO)?'
hypothesis: 'Calibrated from exploratory P5-STRESS-001-PILOT (N=3, 24/24 runs, run_wall_mean_s=163.25
  s; 120 confirmatory runs est. 1.81 h on workers=3): 100% inhibitory-reserve depletion
  amplifies DNp01 (12.222 -> 57.500 Hz) and DNp09 (13.056 -> 20.278 Hz), sensitization+drop
  drives DNp01 to 63.056 Hz, off-pathway inhibitory control stays null (~12.500/12.778
  Hz), while non-defensive visual 60 Hz leaves DNp09 at 0 Hz (monitoring >=2-hop DNp01
  visual convergence).'
