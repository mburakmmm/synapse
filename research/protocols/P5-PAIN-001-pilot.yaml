schema_version: '1.0'
protocol_id: P5-PAIN-001-PILOT
revision: 1
status: draft
analysis_intent: exploratory
question: In adult male Drosophila MaleCNS v1.0, does acute pathway-specific GABAergic
  disinhibition (edge_mask) or GABAergic cell-death proxy (neuron_silencing) onto
  feedforward VNC interneurons amplify MesoLN tactile-driven firing in ascending relays
  (ANXXX027, AN08B012) and jump motor readout TTMn beyond zero-stimulus sham and structurally
  matched VNC GABA controls?
hypothesis: Exploratory pilot (N=3 paired seeds) to characterize baseline dynamic
  range (20 Hz vs 40 Hz), disinhibition vs 50% attenuation vs cell-death separation,
  and post-stimulus persistence prior to freezing confirmatory protocol P5-PAIN-001.
